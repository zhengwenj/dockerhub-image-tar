name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-version:
    name: Detect Version Change
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      release_exists: ${{ steps.version.outputs.release_exists }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version files
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriConfigVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $rootCargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tauriCargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value

          $versions = @($packageVersion, $tauriConfigVersion, $rootCargoVersion, $tauriCargoVersion) | Sort-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version mismatch. package.json=$packageVersion, tauri.conf.json=$tauriConfigVersion, Cargo.toml=$rootCargoVersion, src-tauri/Cargo.toml=$tauriCargoVersion"
          }

          $previousVersion = ""
          $before = "${{ github.event.before }}"
          if ($before -and $before -ne "0000000000000000000000000000000000000000") {
            $previousTauriConfig = git show "$before`:src-tauri/tauri.conf.json" 2>$null
            if ($LASTEXITCODE -eq 0 -and $previousTauriConfig) {
              $previousVersion = ($previousTauriConfig | ConvertFrom-Json).version
            }
          }

          $tag = "v$packageVersion"
          git fetch --tags --force
          $existingTag = git tag --list $tag

          $versionChanged = $previousVersion -and $previousVersion -ne $packageVersion
          $tagMissing = -not $existingTag
          $manualRun = "${{ github.event_name }}" -eq "workflow_dispatch"
          $changed = if ($versionChanged -or $tagMissing -or $manualRun) { "true" } else { "false" }
          $releaseExists = if ($existingTag) { "true" } else { "false" }

          if ($versionChanged -and $existingTag -and -not $manualRun) {
            throw "Release tag $tag already exists."
          }

          "changed=$changed" >> $env:GITHUB_OUTPUT
          "release_exists=$releaseExists" >> $env:GITHUB_OUTPUT
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Current version: $packageVersion"
          Write-Host "Previous version: $previousVersion"
          Write-Host "Existing tag: $existingTag"
          Write-Host "Manual run: $manualRun"
          Write-Host "Release needed: $changed"

  build:
    name: Build ${{ matrix.name }}
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
            artifact: windows
            platform: windows_x64
          - name: macOS
            os: macos-latest
            bundles: dmg
            artifact: macos
            platform: macos_aarch64
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
            platform: linux_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo fmt (tauri)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (tauri)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Build Tauri bundle
        run: pnpm tauri build --bundles "${{ matrix.bundles }}"

      - name: Stage release assets
        env:
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
          ASSET_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path (Get-Location) "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $baseName = "dockerhub-image-tar_$env:RELEASE_VERSION`_$env:ASSET_PLATFORM"
          $targetDir = Join-Path (Get-Location) "src-tauri/target/release"
          $bundleDir = Join-Path $targetDir "bundle"

          if ($env:RUNNER_OS -eq "Windows") {
            $portable = Join-Path $targetDir "dockerhub-image-tar-tauri.exe"
            if (Test-Path $portable) {
              Copy-Item -LiteralPath $portable -Destination (Join-Path $releaseDir "$baseName`_portable.exe")
            }
          } elseif ($env:RUNNER_OS -eq "Linux") {
            $portable = Join-Path $targetDir "dockerhub-image-tar-tauri"
            if (Test-Path $portable) {
              Copy-Item -LiteralPath $portable -Destination (Join-Path $releaseDir "$baseName`_portable")
            }
          }

          Get-ChildItem -Path $bundleDir -Recurse -File | ForEach-Object {
            $extension = $_.Extension
            $destinationName = $null

            if ($extension -eq ".msi") {
              $destinationName = "$baseName.msi"
            } elseif ($extension -eq ".exe" -and $_.Name -like "*setup*") {
              $destinationName = "$baseName`_setup.exe"
            } elseif ($extension -eq ".dmg") {
              $destinationName = "$baseName.dmg"
            } elseif ($extension -eq ".AppImage") {
              $destinationName = "$baseName.AppImage"
            } elseif ($extension -eq ".deb") {
              $destinationName = "$baseName.deb"
            } elseif ($extension -eq ".zip") {
              $destinationName = "$baseName.zip"
            }

            if ($destinationName) {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $releaseDir $destinationName)
            }
          }

          $assets = Get-ChildItem -Path $releaseDir -File
          if (-not $assets) {
            throw "No staged release assets were found."
          }

          $assets | ForEach-Object { Write-Host "Staged asset: $($_.Name)" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-image-tar-${{ needs.detect-version.outputs.version }}-${{ matrix.artifact }}
          path: release-assets/**

  publish:
    name: Publish Release
    needs: [detect-version, build]
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        shell: bash
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { in_section = 1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          sed -i '/[^[:space:]]/,$!d' release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog section found for version $RELEASE_VERSION in CHANGELOG.md."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.detect-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.detect-version.outputs.version }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_VERSION" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "${assets[@]}"
          fi
