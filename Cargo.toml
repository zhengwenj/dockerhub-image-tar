[package]
name = "dockerhub-image-tar"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Pull Docker Hub images directly and export Docker-loadable tar archives."
readme = "README.md"

[dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
